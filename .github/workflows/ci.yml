name: Negotiation CPU contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, checked 2026-11-14
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, checked 2026-11-14
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cpu.lock.txt
      - run: python -m pip install -c requirements-cpu.lock.txt -e ".[dev]"
      - name: Test the negotiation agent
        run: python -m pytest -q
      - run: python negotiation/run_probe.py --backend heuristic --quick --no-records --output runs/ci_negotiation_probe.json
      - run: python negotiation/run_negotiation.py --all-dev --output runs/ci_negotiation_all_dev.json
      - run: python negotiation/run_evaluation.py evaluate --split dev --cases 12 --no-records --output runs/ci_negotiation_eval.json
