<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>공급사 응답 · NAMI</title><link rel="icon" type="image/png" href="/static/nami-logo-64.png"><link rel="stylesheet" href="/static/app.css?v=20261118-submission"><script src="/static/supplier.js?v=20261118-submission" defer></script></head><body class="supplier-page">
<header class="topbar"><div class="brand"><img src="/static/nami-logo.png" alt="" width="36" height="36"><span>NAMI<span class="brand-sub">공급사 응답 화면</span></span></div><span class="environment">합성 거래 · 사람 입력</span></header>
<main class="supplier-main"><section class="page-intro"><div><p class="eyebrow">SUPPLIER VIEW</p><h1>받은 제안에 답해 주세요.</h1><p class="intro-copy">공개 조건과 주고받은 문장만 표시합니다.</p></div><button id="refresh" type="button">새로고침</button></section><p id="error" class="error" role="alert" hidden></p><p id="status" class="evidence-note" aria-live="polite">불러오는 중</p>
<div class="supplier-layout"><section><div class="section-title"><h2>공개 협상 이력</h2><span id="round" class="small-pill"></span></div><ol id="history" class="history"></ol></section>
<section class="card"><h2>응답 작성</h2><p id="clarification" class="error" hidden></p><form id="response-form" class="supplier-form"><p class="form-note">역제안은 세 숫자를 모두 입력하세요. 구매자가 보낸 조건을 그대로 수락할 수도 있습니다.</p><label>단가 (원)<input id="price" type="number" min="1" max="1000000" step="1" inputmode="numeric"></label><label>납기 (일)<input id="delivery" type="number" min="1" max="3650" step="1" inputmode="numeric"></label><label>납품 후 결제 (일)<input id="payment" type="number" min="0" max="3650" step="1" inputmode="numeric"></label><label>전달할 문장 (200자까지)<textarea id="message" maxlength="200" placeholder="예: 결제를 앞당겨 주시면 단가를 조정할 수 있습니다."></textarea></label><button id="counter" class="primary" type="submit">이 조건으로 역제안</button><div class="supplier-buttons"><button id="accept" type="button">받은 조건 수락</button><button id="walk" type="button">협상 종료</button></div></form></section></div><footer>공급사 역할 화면 · 실제 거래나 외부 메시지를 전송하지 않습니다.</footer></main></body></html>
